<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>병맛 게임 센터</title>
<meta name="description" content="초저퀄 병맛 게임 2종: 출근하는 감자 DX / 꽥꽥 편의점 24시">
<style>
:root{--bg:#16162a;--card:#23233f;--ink:#f3f3ff;--sub:#9aa0c8;--y:#ffe14d;--r:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 48px}
h1{text-align:center;font-size:clamp(28px,6vw,42px);margin:8px 0 4px;color:var(--y);text-shadow:3px 3px 0 #000}
.tag{text-align:center;color:var(--r);font-weight:bold;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:3px solid #000;border-radius:14px;padding:22px 18px;box-shadow:6px 6px 0 #000;transition:transform .12s}
a.card:hover,a.card:focus-visible{transform:translate(-3px,-3px) rotate(-.6deg);outline:none}
.emo{font-size:64px;line-height:1;text-align:center;margin-bottom:10px}
.card h2{margin:0 0 6px;font-size:24px;text-align:center}
.genre{display:block;width:max-content;margin:0 auto 12px;padding:3px 10px;border-radius:99px;background:#000;color:var(--y);font-size:12px;font-weight:bold}
.card p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.5;text-align:center}
.go{display:block;text-align:center;background:#2e8b2e;border:3px solid #000;border-radius:8px;padding:10px;font-weight:bold;font-size:17px}
.go.y{background:#b8860b}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<main>
  <h1>병맛 게임 센터</h1>
  <p class="tag">초저퀄 · 무료 · 후회는 무료 아님</p>
  <div class="grid">
    <a class="card" href="./potato/">
      <div class="emo">🥔💼</div>
      <h2>출근하는 감자 DX</h2>
      <span class="genre">플래피 · 극악 리듬</span>
      <p>클릭으로 날아서 대파를 피한다. 입력 지연, 도망가는 대파, 가짜 클리어, 되살아나는 보스. 무사고 약 5분. 엔딩은 갑자기 진지하다.</p>
      <span class="go">▶ 출근하기</span>
    </a>
    <a class="card" href="./duck/">
      <div class="emo">🦆🏪</div>
      <h2>꽥꽥 편의점 24시</h2>
      <span class="genre">5초 미니게임 연속</span>
      <p>야간 알바 오리의 지옥 근무. 12종 미니게임을 설명 읽을 새도 없이 해치운다. 3교대 + 사장님. 퇴직금은 0원.</p>
      <span class="go y">▶ 알바하기</span>
    </a>
  </div>
  <footer>모바일/PC 모두 됩니다 · 소리 켜짐 주의 (삑삑)</footer>
</main>
</body>
</html>
