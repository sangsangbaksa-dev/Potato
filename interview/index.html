<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>면접의 신: 이력서는 감자</title>
<style>
html,body{margin:0;height:100%;background:#120a18;overflow:hidden;font-family:"Comic Sans MS","Malgun Gothic",sans-serif;touch-action:manipulation;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#2a2038;max-width:100%;max-height:100%;aspect-ratio:3/4;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="360" height="480"></canvas></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=480;
const Q=[
 {who:'🧑‍💼',name:'HR',q:'자기소개 30초.',a:['저는 감자입니다. 30초면 충분합니다.','열정·도전·융합... (백지)','저는 사람입니다. (거짓)'],c:0,h:'솔직함 칭찬 · 다음 질문 지옥'},
 {who:'🧑‍💼',name:'HR',q:'우리 회사에 지원한 이유는?',a:['급여 명세서에 "감자"라고 써 있어서요.','귀사의 비전에 공감합니다. (비전 모름)','대파와의 협업 경험'],c:1,h:'비전 모름 = 합격 (병맛 HR)'},
 {who:'🌿',name:'대파',q:'감자 vs 대파, 누가 이기나요?',a:['대파요. (정답)','감자요. (용감)','둘 다 으깨면 수프'],c:2,h:'수프 답변 · CEO 눈길'},
 {who:'🦆',name:'편의점 사장',q:'야간 알바 가능?',a:['꽥꽥 편의점 24시 경력 6시간','불가능합니다','시급 150원이면 24시간'],c:0,h:'경력 인정 · 단 시급 협상 실패'},
 {who:'🧑‍💼',name:'HR',q:'스트레스 받으면?',a:['가만히 있습니다 (챌린지 5클)','운동합니다','대파를 먹습니다'],c:0,h:'움직이지 않음 = 프로'},
 {who:'🌿',name:'대파',q:'5년 후 커리어?',a:['감자튀김 → CEO','대파 대왕의 부하','퇴사'],c:0,h:'야망 · 의심과 admiration'},
 {who:'🧔',name:'부장',q:'주말에 연락되면?',a:['네 즐겁습니다','전화를 끊고 가만히 있음','감자는 주말이 없습니다'],c:2,h:'정답이었는데 부장 표정 ☹'},
 {who:'🧑‍💼',name:'HR',q:'약점은?',a:['너무 완벽함','대파 앞에서 약함','솔직히 클릭을 못 참음'],c:1,h:'약점 인정 · 신뢰↑'},
 {who:'🦆',name:'사장',q:'팀워크란?',a:['혼자 출근하는 감자 DX','꽥','남 탓하기'],c:1,h:'꽥 = 팀 빌딩 완료'},
 {who:'🌿',name:'CEO',q:'연봉 희망?',a:['150원/시 (편의점 기준)','시장가','감자 1kg'],c:0,h:'현실적 · 인사팀 곤란'},
 {who:'🧑‍💼',name:'HR',q:'마지막 질문. 합격?',a:['아니요 (謙遜)','네','면접관이 먼저 말해주세요'],c:2,h:'역질문 · 합격 (병맛)'},
 {who:'🌿',name:'CEO',q:'오늘 점심?',a:['감자탕 (동족)','대파전','회의 도시락'],c:1,h:'대파전 · CEO 미소'},
 {who:'🥔',name:'???',q:'당신은 감자입니까?',a:['Yes','No','Philosophically'],c:0,h:'메타 · 면접관 전원 고개 끄덕'},
 {who:'🧑‍💼',name:'HR',q:'최종. 우리를 한 단어로?',a:['병맛','가족','대파'],c:0,h:'정직 · 채용 (왜?)'},
 {who:'🌿',name:'CEO',q:'지금 바로 출근?',a:['네','아니요','이미 출근 중 (출근하는 감자)'],c:2,h:'크로스오버 · 즉시 입사'}
];
const BAD=['면접관: "오늘은 여기까지" (영구)','CEO: "감자 따위..." · 보안 escort','HR: 채팅에 실수로 욕설','부장: "주말?" · 이미 카톡 옴','편의점 사장: 시급 인하 제안'];
let st='title',qi=0,time=0,stress=20,score=0,shake=0,flash=0,t=0,clears=0,fails=0,fb='',fbT=0,endT=0,salary=0;
try{clears=+localStorage.interviewClear||0;fails=+localStorage.interviewFails||0}catch(e){}
let ac;function beep(f,d=.1,type='square',v=.07){try{ac=ac||new AudioContext();const o=ac.createOscillator(),u=ac.createGain();o.type=type;o.frequency.value=f;u.gain.setValueAtTime(v,ac.currentTime);u.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(u);u.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const pick=a=>a[Math.random()*a.length|0],inR=(x,y,r)=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];
function txt(s,x,y,sz,col,out){g.font='bold '+sz+'px "Comic Sans MS","Malgun Gothic",sans-serif';g.textAlign='center';g.textBaseline='middle';if(out){g.strokeStyle=out;g.lineWidth=4;g.lineJoin='round';g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function emo(s,x,y,sz){g.font=sz+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function btn(r,l,col){g.fillStyle=col;g.fillRect(r[0],r[1],r[2],r[3]);g.strokeStyle='#000';g.lineWidth=3;g.strokeRect(r[0],r[1],r[2],r[3]);txt(l,r[0]+r[2]/2,r[1]+r[3]/2,Math.min(14,r[3]*.38),'#fff')}

function startRun(){qi=0;time=0;stress=15;score=0;st='play';t=0;fb='';beep(350,.1)}
function pickAns(i){
  if(st!=='play')return;
  const q=Q[qi];const ok=i===q.c;
  if(!ok){st='dead';t=0;fails++;try{localStorage.interviewFails=fails}catch(e){};fb=pick(BAD);shake=18;beep(100,.35,'sawtooth');return}
  score++;stress=Math.max(0,stress-8);fb=q.h;fbT=100;beep(660,.08);qi++;
  if(qi>=Q.length){st='offer';endT=0;salary=150+score*37;clears++;try{localStorage.interviewClear=clears}catch(e){};beep(880,.25)}
  else time=0;
}
function tap(x,y){
  if(st==='title'){startRun();return}
  if(st==='dead'&&t>40&&inR(x,y,[55,370,250,46])){startRun();return}
  if(st==='offer'&&endT>800){st='title';t=0;return}
  if(st!=='play')return;
  const rs=[[15,280,330,52],[15,340,330,52],[15,400,330,52]];
  for(let i=0;i<3;i++)if(inR(x,y,rs[i]))pickAns(i);
}
function xy(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
c.addEventListener('pointerdown',e=>{e.preventDefault();tap(...xy(e))});

function update(){
  t++;if(shake>0)shake--;if(flash>0)flash--;if(fbT>0)fbT--;
  if(st==='play'){time++;stress=Math.min(100,stress+.06+qi*.02);if(stress>=100){st='dead';t=0;fails++;fb='긴장 과다 · 면접실 기절';beep(80,.4)}}
  if(st==='offer')endT++;
}

function draw(){
  g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  g.fillStyle='#2a2038';g.fillRect(-10,-10,W+20,H+20);
  if(st==='title'){
    g.fillStyle='#120a18';g.fillRect(0,0,W,H);
    emo('📄',180,70,60);emo('🥔',180,130,50);
    txt('면접의 신',180,175,32,'#ffe14d','#000');txt('이력서는 감자',180,210,20,'#ff6b6b','#000');
    txt('15문항 · 정답이 항상 정답은 아님',180,250,13,'#ccc');txt('(이 게임은 정답이 정답임)',180,272,12,'#888');
    txt(clears?'합격 '+clears+'회 · 탈락 '+fails:'기록 없음',180,300,12,'#889');
    if(t%60<40)txt('▶ 클릭해서 면접장 입장 ◀',180,420,17,'#7CFC00');
    g.restore();return;
  }
  g.fillStyle='#1a1228';g.fillRect(0,0,W,70);
  txt('Q '+(Math.min(qi+1,Q.length))+'/'+Q.length,180,18,14,'#fff','#000');
  g.fillStyle='rgba(0,0,0,.3)';g.fillRect(20,32,320,8);g.fillStyle='#f66';g.fillRect(20,32,320*stress/100,8);

  if(st==='play'){
    const q=Q[qi];
    emo(q.who,180,110,64);txt(q.name,180,155,14,'#ff9');
    g.fillStyle='rgba(255,255,255,.08)';g.fillRect(20,170,320,90);
    txt(q.q,180,215,Math.min(18,q.q.length>20?15:18),'#fff');
    const rs=[[15,280,330,52],[15,340,330,52],[15,400,330,52]];
    for(let i=0;i<3;i++)btn(rs[i],q.a[i].slice(0,28),'#4a3a6a');
    g.fillStyle='#3a3';g.fillRect(20,460,320*(1-time/420),6);
    if(fbT>0)txt(fb,180,255,12,'#7f7','#000');
  }
  if(st==='dead'){
    g.fillStyle='rgba(0,0,0,.88)';g.fillRect(0,0,W,H);
    txt('불합격',180,130,36,'#f55','#000');txt(fb||pick(BAD),180,185,14,'#fff');
    txt('Q'+(qi+1)+'에서 탈락',180,230,14,'#ff9');
    btn([55,370,250,46],'▶ 재지원','#2e8');
  }
  if(st==='offer'){
    g.fillStyle='#1a3020';g.fillRect(0,0,W,H);
    const n=Math.min(6,Math.floor(endT/60));
    const lines=['축하합니다!','최종 합격 (왜?)','연봉: '+salary+'원','(월, 세전, 감자 환산)','직급: 수습 감자','출근: 내일 04:00','복지: 대파 할인 0%'];
    for(let i=0;i<n;i++)txt(lines[i],180,90+i*38,i===2?22:16,i===2?'#ffe14d':'#dfe');
    emo('🌿',180,340,50);emo('🥔',120,360,40);
    if(endT>800&&t%60<40)txt('▶ 처음으로 ◀',180,430,14,'#7CFC00');
  }
  g.restore();
}
let last=performance.now(),acc=0;(function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)})(last);
</script>
</body>
</html>
