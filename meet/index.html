<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>회의 탈출: 점프맵</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;font-family:"Comic Sans MS","Malgun Gothic",sans-serif;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{background:#2a3544;max-width:100%;max-height:100%;aspect-ratio:3/4;image-rendering:pixelated;cursor:crosshair}
#touch{display:none;position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:min(360px,96vw);gap:8px;grid-template-columns:1fr 1fr 1fr}
#touch button{font:bold 16px inherit;padding:14px 0;border:3px solid #000;border-radius:10px;background:#445;color:#fff}
#touch .j{background:#2a8}
@media(pointer:coarse){#touch{display:grid}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="480"></canvas>
<div id="touch"><button data-k="L">◀</button><button data-k="J" class="j">점프</button><button data-k="R">▶</button></div>
</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=480;
const LV_RAW=[
 {n:'회의실 A',w:920,door:860,spawn:[40,392],pl:[[0,420,920,60],[120,340,140,16],[320,280,120,16],[500,320,100,16],[640,240,130,16],[780,300,90,16],[450,360,70,16,1]],hz:[[280,418,40,8,'☕'],[520,418,40,8,'☕'],[600,330,50,6,'💀']],pat:[{x:400,y:404,w:60,v:1.6,e:'😴'},{x:650,y:350,w:50,v:2,e:'📧'}]},
 {n:'프로젝터룸',w:1100,door:1040,spawn:[40,392],pl:[[0,420,1100,60],[80,350,90,16],[220,290,110,16],[380,330,80,16,1],[480,250,140,16],[660,300,100,16],[820,220,120,16],[950,340,100,16]],hz:[[350,418,50,8,'📽️'],[700,418,50,8,'📽️'],[480,240,40,6,'💀']],pat:[{x:300,y:404,w:80,v:1.9,e:'🧑‍💼'},{x:600,y:274,w:70,v:-1.5,e:'😴'},{x:850,y:300,w:60,v:2.2,e:'🌿'}]},
 {n:'CEO관',w:1280,door:1210,spawn:[40,392],pl:[[0,420,1280,60],[100,360,100,16],[250,300,90,16,1],[400,350,70,16],[520,270,120,16],[680,220,100,16],[820,280,110,16],[980,200,130,16],[1120,320,100,16]],hz:[[450,418,60,8,'☕'],[850,418,60,8,'☕'],[1050,198,40,8,'🌿'],[720,270,55,6,'💀']],pat:[{x:520,y:254,w:90,v:2.1,e:'🌿'},{x:900,y:404,w:100,v:-1.8,e:'👔'},{x:1100,y:280,w:70,v:2.5,e:'🦆'}]}
];
let pl=[],st='title',lv=0,cam=0,px=40,py=392,vx=0,vy=0,onG=1,coyote=0,jBuf=0,hp=2,t=0,shake=0,clears=0,bestT=0,runT=0,endT=0,msg='',msgT=0,invT=0,wind=0,rngT=0,toasts=[],meetT=0;
const SP=2.85,JF=-8.5,GR=.46,MW=26,MH=28,FLOOR=420;
const FAKE=['클라우드 저장됨 ✓','업적: 클릭 1회','튜토리얼 완료 (거짓)','광고 30초 스킵됨','마이크 ON · 전사 방송','난이도: 쉬움으로 변경','버그 리포트 접수 (휴지통)','감자 스킨 장착'];
try{clears=+localStorage.meetClear2||0;bestT=+localStorage.meetBestT||0}catch(e){}
let keys={L:0,R:0,J:0,jp:0},ac;
function beep(f,d=.08,type='square',v=.07){try{ac=ac||new AudioContext();const o=ac.createOscillator(),u=ac.createGain();o.type=type;o.frequency.value=f;u.gain.setValueAtTime(v,ac.currentTime);u.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(u);u.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function randSfx(){const t=['square','sawtooth','triangle'][Math.random()*3|0];beep(40+Math.random()*1400,.05+Math.random()*.25,t,.06+Math.random()*.14);if(Math.random()<.3)setTimeout(()=>beep(90+Math.random()*600,.12,'sawtooth',.1),60)}
function fakeClick(x,y){toasts.push({x,y,t:100,msg:FAKE[Math.random()*FAKE.length|0]});randSfx();if(Math.random()<.15){msg='...아무 일도 없음';msgT=50}}
function txt(s,x,y,sz,col,out){g.font='bold '+sz+'px "Comic Sans MS",sans-serif';g.textAlign='center';g.textBaseline='middle';if(out){g.strokeStyle=out;g.lineWidth=4;g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function emo(s,x,y,sz){g.font=sz+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function start(){lv=0;loadLv();st='play';runT=0;hp=2;meetT=0;beep(440,.12);randSfx()}
function loadLv(){const L=LV_RAW[lv];pl=L.pl.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3],fake:p[4]||0,life:p[4]?45:999}));px=L.spawn[0];snapFloor();vx=vy=0;cam=0;onG=1;coyote=10;jBuf=0;wind=(Math.random()<.5?-1:1)*(0.8+lv*.3)}
function rects(){return pl.filter(p=>p.life>0)}
function snapFloor(){py=FLOOR-MH;for(const r of rects()){if(px+MW>r.x&&px<r.x+r.w&&r.y<=FLOOR&&r.y+r.h>FLOOR)py=Math.min(py,r.y-MH)}}
function movePlat(){
  if(keys.jp){jBuf=12;keys.jp=0}
  if(jBuf>0&&(onG||coyote>0)){vy=JF;onG=0;coyote=0;jBuf=0;beep(520,.06)}
  if(jBuf>0)jBuf--;
  vy+=GR;px+=vx+wind*.35;py+=vy;
  onG=0;
  const rs=rects(),feet=py+MH;
  for(const r of rs){
    if(px+MW<=r.x||px>=r.x+r.w)continue;
    if(feet>=r.y-1&&feet<=r.y+22&&vy>=0){
      if(r.fake&&r.life>0){r.life--;if(r.life<=0){vy=JF*.35;beep(200,.2);msg='가짜 책상!';msgT=40}}
      else{py=r.y-MH;vy=0;onG=1;if(r.fake)r.life--}
    }
    else if(py+MH>r.y&&py<r.y+r.h&&vy<0){py=r.y+r.h;vy=0}
    else if(px+MW>r.x&&px<r.x+r.w&&py+MH>r.y&&py<r.y+r.h){const dx=(px+MW/2)-(r.x+r.w/2);if(dx>0)px=r.x+r.w;else px=r.x-MW;vx=0}
  }
  if(onG)coyote=10;else if(coyote>0)coyote--;
}
function hurt(){hp--;shake=14;beep(120,.25,'sawtooth');randSfx();if(hp<=0){st='dead';t=0;beep(80,.4)}}
function chaos(){
  rngT++;
  if(rngT%180===0&&Math.random()<.45)randSfx();
  if(st==='play'){
    meetT++;
    if(meetT>3600-lv*400){msg='회의 연장! (난이도↑)';msgT=80;wind*=1.2;meetT=0;randSfx()}
    if(rngT%500===0&&Math.random()<.3){invT=150;msg='⌨ 조작 반전 2.5초';msgT=70;beep(300,.3,'triangle')}
    if(rngT%320===0&&Math.random()<.2){shake=20;beep(40,1.2,'sawtooth',.2)}
  }
  if(invT>0)invT--;
  for(const o of toasts)o.t--;
  toasts=toasts.filter(o=>o.t>0);
}
function update(){
  t++;if(shake>0)shake--;if(msgT>0)msgT--;chaos();
  if(st==='play'){
    runT++;
    let Lk=keys.L,Rk=keys.R;if(invT>0){Lk=keys.R;Rk=keys.L}
    if(Lk)vx=-SP;else if(Rk)vx=SP;else vx*=.72;
    movePlat();
    if(py>H+40)hurt();
    const L=LV_RAW[lv];cam=Math.max(0,Math.min(L.w-W,px-W*.35));
    for(const h of L.hz){const hx=h[0],hy=h[1],hw=h[2],hh=h[3];if(px+MW>hx&&px<hx+hw&&py+MH>hy&&py<hy+hh){hurt();px=Math.max(10,px-40)}}
    for(const p of L.pat){p.x+=p.v*(1+lv*.15);if(p.x<50||p.x>L.w-50)p.v*=-1;if(Math.abs(px+MW/2-p.x)<30&&Math.abs(py+MH/2-p.y)<26)hurt()}
    if(px>L.door){if(lv>=2){st='win';endT=0;clears++;try{localStorage.meetClear2=clears;if(!bestT||runT<bestT){bestT=runT;localStorage.meetBestT=bestT}}catch(e){};beep(880,.2)}else{lv++;msg='CH '+(lv+1)+'! 더 지옥';msgT=90;loadLv();beep(660,.1)}}
  }
  if(st==='win')endT++;
}
function drawWorld(){
  const L=LV_RAW[lv];g.save();g.translate(-cam,0);
  for(const p of pl){if(p.life<=0)continue;g.fillStyle=p.fake?'#888':'#3d4a5c';g.fillRect(p.x,p.y,p.w,p.h);g.strokeStyle=p.fake?'#f66':'#111';g.strokeRect(p.x,p.y,p.w,p.h);if(p.fake)txt('?',p.x+p.w/2,p.y-8,12,'#faa')}
  for(const h of L.hz)emo(h[4],h[0]+h[2]/2,h[1]-12,22);
  for(const p of L.pat)emo(p.e,p.x,p.y,32);
  g.fillStyle='#2e8b2e';g.fillRect(L.door,360,50,60);emo('🚪',L.door+25,390,36);
  emo('🥔',px+MW/2,py+MH/2,26);g.restore();
}
function drawDecoys(){
  g.fillStyle='#444';g.fillRect(4,42,52,20);txt('⚙ 설정',30,52,9,'#ccc');
  g.fillStyle='#633';g.fillRect(300,42,56,20);txt('SKIP▶',328,52,9,'#fff');
  g.fillStyle='rgba(255,255,0,.15)';g.fillRect(120,200,120,40);txt('보너스 상자',180,220,11,'#ff0');
}
function draw(){
  g.fillStyle='#1a2332';g.fillRect(0,0,W,H);
  if(st==='title'){
    drawDecoys();
    emo('🥔',180,90,64);txt('회의 탈출',180,150,32,'#ffe14d','#000');txt('극악 점프맵',180,182,24,'#f66','#000');
    txt('클릭해도 됩니다 (아무 일 없음)',180,218,12,'#9ab');txt('← → · Space · 가짜 책상 · 조작 반전',180,240,11,'#ccc');
    txt('클리어 '+clears,180,280,12,'#889');
    if(t%60<40)txt('Space로 시작',180,400,18,'#7CFC00');
    for(const o of toasts){g.globalAlpha=o.t/100;txt(o.msg,o.x,o.y,10,'#fff','#000');g.globalAlpha=1}
    return;
  }
  drawWorld();drawDecoys();
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,36);
  txt('MAP '+(lv+1)+'/3 '+LV_RAW[lv].n,180,12,13,'#fff','#000');
  let h='';for(let i=0;i<2;i++)h+=i<hp?'❤️':'🖤';emo(h,180,28,14);
  if(msgT>0)txt(msg,W/2,60,16,'#ff9','#000');
  for(const o of toasts){g.globalAlpha=Math.min(1,o.t/50);txt(o.msg,o.x,o.y,10,'#fff','#000');g.globalAlpha=1}
  if(st==='dead'){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,0,W,H);txt('회의에 붙잡힘',180,200,28,'#f66','#000');txt('Space 재시도 · 클릭은 여전히 무용',180,240,12,'#aaa');txt('Space',180,280,16,'#fff')}
  if(st==='win'){g.fillStyle='rgba(0,0,0,.8)';g.fillRect(0,0,W,H);txt('탈출 성공!',180,180,32,'#7CFC00','#000');txt('다음 회의 3초 뒤',180,230,14,'#fff');if(endT>120&&t%60<40)txt('Space 처음으로',180,300,14,'#aaa')}
}
function loop(){update();draw();requestAnimationFrame(loop)}
function cxy(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
c.addEventListener('pointerdown',e=>{const [x,y]=cxy(e);fakeClick(x,y)});
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=1;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=1;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(st==='title'||st==='dead')start();else if(st==='win'){st='title';t=0}else keys.jp=1}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=0;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=0;
});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='title'||st==='dead')start();if(k==='J')keys.jp=1;else keys[k]=1});
  b.addEventListener('pointerup',()=>{if(k!=='J')keys[k]=0});
  b.addEventListener('pointerleave',()=>{if(k!=='J')keys[k]=0});
});
loop();
</script>
</body>
</html>
