<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>회의 탈출: 점프맵</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden;font-family:"Comic Sans MS","Malgun Gothic",sans-serif;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{background:#2a3544;max-width:100%;max-height:100%;aspect-ratio:3/4;image-rendering:pixelated}
#touch{display:none;position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:min(360px,96vw);gap:8px;grid-template-columns:1fr 1fr 1fr}
#touch button{font:bold 16px inherit;padding:14px 0;border:3px solid #000;border-radius:10px;background:#445;color:#fff}
#touch .j{background:#2a8}
@media(pointer:coarse){#touch{display:grid}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="480"></canvas>
<div id="touch"><button data-k="L">◀</button><button data-k="J" class="j">점프</button><button data-k="R">▶</button></div>
</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=480;
const LV=[
 {n:'회의실 A',w:920,door:860,spawn:[40,392],pl:[[0,420,920,60],[120,340,140,16],[320,280,120,16],[500,320,100,16],[640,240,130,16],[780,300,90,16]],hz:[[280,418,40,8,'☕'],[520,418,40,8,'☕']],pat:[{x:400,y:404,w:60,v:1.2,e:'😴'}]},
 {n:'프로젝터룸',w:1100,door:1040,spawn:[40,392],pl:[[0,420,1100,60],[80,350,90,16],[220,290,110,16],[380,330,80,16],[480,250,140,16],[660,300,100,16],[820,220,120,16],[950,340,100,16]],hz:[[350,418,50,8,'📽️'],[700,418,50,8,'📽️']],pat:[{x:300,y:404,w:80,v:1.5,e:'🧑‍💼'},{x:600,y:274,w:70,v:-1.1,e:'😴'}]},
 {n:'CEO관',w:1280,door:1210,spawn:[40,392],pl:[[0,420,1280,60],[100,360,100,16],[250,300,90,16],[400,350,70,16],[520,270,120,16],[680,220,100,16],[820,280,110,16],[980,200,130,16],[1120,320,100,16]],hz:[[450,418,60,8,'☕'],[850,418,60,8,'☕'],[1050,198,40,8,'🌿']],pat:[{x:520,y:254,w:90,v:1.8,e:'🌿'},{x:900,y:404,w:100,v:-1.4,e:'👔'}]}
];
let st='title',lv=0,cam=0,px=40,py=392,vx=0,vy=0,onG=1,coyote=0,jBuf=0,hp=3,t=0,shake=0,clears=0,bestT=0,runT=0,endT=0,msg='',msgT=0;
const SP=2.6,JF=-8.8,GR=.42,MW=26,MH=28,FLOOR=420;
try{clears=+localStorage.meetClear2||0;bestT=+localStorage.meetBestT||0}catch(e){}
let keys={L:0,R:0,J:0,jp:0},ac;
function beep(f,d=.08,type='square',v=.07){try{ac=ac||new AudioContext();const o=ac.createOscillator(),u=ac.createGain();o.type=type;o.frequency.value=f;u.gain.setValueAtTime(v,ac.currentTime);u.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(u);u.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function txt(s,x,y,sz,col,out){g.font='bold '+sz+'px "Comic Sans MS",sans-serif';g.textAlign='center';g.textBaseline='middle';if(out){g.strokeStyle=out;g.lineWidth=4;g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function emo(s,x,y,sz){g.font=sz+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function start(){lv=0;loadLv();st='play';runT=0;hp=3;beep(440,.12)}
function loadLv(){const L=LV[lv];px=L.spawn[0];snapFloor();vx=vy=0;cam=0;onG=1;coyote=10;jBuf=0}
function rects(){return LV[lv].pl.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3]}))}
function snapFloor(){py=FLOOR-MH;for(const r of rects()){if(px+MW>r.x&&px<r.x+r.w&&r.y<=FLOOR&&r.y+r.h>FLOOR)py=Math.min(py,r.y-MH)}}
function movePlat(){
  if(keys.jp){jBuf=12;keys.jp=0}
  if(jBuf>0&&(onG||coyote>0)){vy=JF;onG=0;coyote=0;jBuf=0;beep(520,.06)}
  if(jBuf>0)jBuf--;
  vy+=GR;px+=vx;py+=vy;
  onG=0;
  const rs=rects(),feet=py+MH;
  for(const r of rs){
    if(px+MW<=r.x||px>=r.x+r.w)continue;
    if(feet>=r.y-1&&feet<=r.y+20&&vy>=0){py=r.y-MH;vy=0;onG=1}
    else if(py+MH>r.y&&py<r.y+r.h&&vy<0){py=r.y+r.h;vy=0}
    else if(px+MW>r.x&&px<r.x+r.w&&py+MH>r.y&&py<r.y+r.h){
      const dx=(px+MW/2)-(r.x+r.w/2);
      if(dx>0)px=r.x+r.w;else px=r.x-MW;vx=0;
    }
  }
  if(onG)coyote=10;else if(coyote>0)coyote--;
}
function hurt(){hp--;shake=14;beep(120,.25,'sawtooth');if(hp<=0){st='dead';t=0;beep(80,.4)}}
function update(){
  t++;if(shake>0)shake--;if(msgT>0)msgT--;
  if(st==='play'){
    runT++;
    if(keys.L)vx=-SP;else if(keys.R)vx=SP;else vx*=.75;
    movePlat();
    if(py>H+40)hurt();
    const L=LV[lv];cam=Math.max(0,Math.min(L.w-W,px-W*.35));
    for(const h of L.hz){const hx=h[0],hy=h[1],hw=h[2],hh=h[3];if(px+MW>hx&&px<hx+hw&&py+MH>hy&&py<hy+hh){hurt();px=Math.max(10,px-30)}}
    for(const p of L.pat){p.x+=p.v;if(p.x<50||p.x>L.w-50)p.v*=-1;if(Math.abs(px+MW/2-p.x)<28&&Math.abs(py+MH/2-p.y)<24)hurt()}
    if(px>L.door){if(lv>=2){st='win';endT=0;clears++;try{localStorage.meetClear2=clears;if(!bestT||runT<bestT){bestT=runT;localStorage.meetBestT=bestT}}catch(e){};beep(880,.2)}else{lv++;msg='CH '+(lv+1)+'!';msgT=90;loadLv();beep(660,.1)}}
  }
  if(st==='win')endT++;
}
function drawWorld(){
  const L=LV[lv];g.save();g.translate(-cam,0);
  g.fillStyle='#3d4a5c';for(const p of L.pl){g.fillRect(p[0],p[1],p[2],p[3]);g.strokeStyle='#111';g.strokeRect(p[0],p[1],p[2],p[3])}
  for(const h of L.hz)emo(h[4],h[0]+h[2]/2,h[1]-12,22);
  for(const p of L.pat)emo(p.e,p.x,p.y,32);
  g.fillStyle='#2e8b2e';g.fillRect(L.door,360,50,60);emo('🚪',L.door+25,390,36);
  emo('🥔',px+MW/2,py+MH/2,26);g.restore();
}
function draw(){
  g.fillStyle='#1a2332';g.fillRect(0,0,W,H);
  if(st==='title'){
    emo('🥔',180,90,64);txt('회의 탈출',180,150,32,'#ffe14d','#000');txt('점프맵',180,182,24,'#6cf','#000');
    txt('← → 이동 · Space / 점프 버튼',180,230,13,'#ccc');txt('3층 탈출 · 함정 ☕ · CEO 🌿',180,252,13,'#ccc');
    txt('클리어 '+clears+(bestT?' · 최단 '+Math.floor(bestT/60)+'초':''),180,290,12,'#889');
    if(t%60<40)txt('Space로 시작',180,400,18,'#7CFC00');
    return;
  }
  drawWorld();
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,36);
  txt('MAP '+(lv+1)+'/3 '+LV[lv].n,180,12,13,'#fff','#000');
  let h='';for(let i=0;i<3;i++)h+=i<hp?'❤️':'🖤';emo(h,180,28,14);
  if(msgT>0)txt(msg,W/2,60,16,'#ff9','#000');
  if(st==='dead'){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,0,W,H);txt('회의에 붙잡힘',180,200,28,'#f66','#000');txt('Space 재시도',180,260,16,'#fff')}
  if(st==='win'){g.fillStyle='rgba(0,0,0,.8)';g.fillRect(0,0,W,H);txt('탈출 성공!',180,180,32,'#7CFC00','#000');txt('다음 회의 5분 뒤 (캘린더 자동)',180,230,14,'#fff');if(endT>120&&t%60<40)txt('Space 처음으로',180,300,14,'#aaa')}
}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=1;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=1;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(st==='title'||st==='dead')start();else if(st==='win'){st='title';t=0}else keys.jp=1}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=0;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=0;
});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='title'||st==='dead')start();if(k==='J')keys.jp=1;else keys[k]=1});
  b.addEventListener('pointerup',()=>{if(k!=='J')keys[k]=0});
  b.addEventListener('pointerleave',()=>{if(k!=='J')keys[k]=0});
});
loop();
</script>
</body>
</html>
