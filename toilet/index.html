<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>복도 격투: 화장실까지</title>
<style>
html,body{margin:0;height:100%;background:#1a1520;overflow:hidden;font-family:"Comic Sans MS","Malgun Gothic",sans-serif;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{background:#4a4035;max-width:100%;max-height:100%;aspect-ratio:3/4}
#touch{display:none;position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:min(360px,96vw);grid-template-columns:1fr 1fr 1fr;gap:6px}
#touch button{font:bold 15px inherit;padding:12px;border:3px solid #000;border-radius:8px;background:#555;color:#fff}
#touch .a{background:#c44}
@media(pointer:coarse){#touch{display:grid}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="480"></canvas>
<div id="touch"><button data-k="L">◀</button><button data-k="A" class="a">💼</button><button data-k="R">▶</button></div>
</div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=480;
const WAVES=[
 [{e:'📋',hp:2,sp:1.1,d:0},{e:'📋',hp:2,sp:1.1,d:40},{e:'☕',hp:3,sp:1.3,d:80}],
 [{e:'👔',hp:5,sp:1.2,d:0},{e:'📋',hp:2,sp:1.4,d:50},{e:'👔',hp:4,sp:1.3,d:100}],
 [{e:'🦆',hp:18,sp:1.5,d:0,boss:1}]
];
let st='title',wave=0,spawnT=0,enemies=[],pending=[],px=80,py=400,dir=1,hp=5,pee=0,combo=0,comboT=0,atk=0,atkT=0,shake=0,t=0,clears=0,msg='',msgT=0,endT=0;
try{clears=+localStorage.toiletClear2||0}catch(e){}
let keys={L:0,R:0,A:0,aP:0},ac;
function beep(f,d=.08,type='square',v=.07){try{ac=ac||new AudioContext();const o=ac.createOscillator(),u=ac.createGain();o.type=type;o.frequency.value=f;u.gain.setValueAtTime(v,ac.currentTime);u.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(u);u.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const rnd=(a,b)=>a+Math.random()*(b-a);
function txt(s,x,y,sz,col,out){g.font='bold '+sz+'px "Comic Sans MS",sans-serif';g.textAlign='center';g.textBaseline='middle';if(out){g.strokeStyle=out;g.lineWidth=4;g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y)}
function emo(s,x,y,sz){g.font=sz+'px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,x,y)}
function start(){wave=0;spawnT=0;enemies=[];pending=[];px=80;hp=5;pee=0;combo=0;st='play';t=0;queueWave();beep(300,.1)}
function queueWave(){pending=WAVES[wave].map(s=>({e:s.e,hp:s.hp,mhp:s.hp,x:W+40,y:400+rnd(-20,20),vx:-s.sp,boss:!!s.boss,spawnAt:s.d}))}
function doAtk(){
  if(st!=='play'||atkT>0)return;atk=1;atkT=16;beep(180,.05,'sawtooth');
  const hx=px+(dir>0?30:-50),hy=py-10;
  for(const en of enemies){if(!en.alive)continue;if(Math.abs(en.x-hx)<42&&Math.abs(en.y-hy)<36){
    en.hp--;shake=8;combo++;comboT=90;beep(260+combo*30,.05);
    if(en.hp<=0){en.alive=0;beep(120,.15);if(en.boss&&wave>=2){st='win';endT=0;clears++;try{localStorage.toiletClear2=clears}catch(e){};beep(880,.25)}}
  }}
}
function update(){
  t++;if(shake>0)shake--;if(msgT>0)msgT--;if(comboT>0)comboT--;else combo=0;
  if(atkT>0)atkT--;else atk=0;
  if(st==='play'){
    pee=Math.min(100,pee+.09);
    if(pee>=100){st='dead';t=0;msg='방광 한계';beep(60,.5,'sawtooth');return}
    if(keys.L){px=Math.max(30,px-2.8);dir=-1}
    if(keys.R){px=Math.min(W-30,px+2.8);dir=1}
    if(keys.aP){doAtk();keys.aP=0}
    spawnT++;
    for(let i=pending.length-1;i>=0;i--)if(spawnT>=pending[i].spawnAt){enemies.push({...pending[i],alive:1});pending.splice(i,1)}
    for(const en of enemies){
      if(!en.alive)continue;
      en.x+=en.vx;
      if(en.x<px+28&&en.x>px-28&&Math.abs(en.y-py)<30&&spawnT%30===0){hp--;shake=12;beep(100,.2)}
      if(en.x<-80&&!en.boss)en.alive=0;
    }
    if(hp<=0){st='dead';t=0;msg='KO';beep(80,.4)}
    const live=enemies.filter(e=>e.alive);
    if(!pending.length&&!live.length&&wave<2){wave++;spawnT=0;msg='WAVE '+(wave+1);msgT=80;queueWave();beep(500,.1)}
  }
  if(st==='win')endT++;
}
function draw(){
  g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  g.fillStyle='#5a5048';g.fillRect(0,0,W,H);g.fillStyle='#6a6058';g.fillRect(0,420,W,60);
  if(st==='title'){
    g.fillStyle='#1a1520';g.fillRect(0,0,W,H);
    emo('🥊',180,90,60);emo('🚽',180,150,48);
    txt('복도 격투',180,200,30,'#ffe14d','#000');txt('화장실까지',180,232,22,'#f96','#000');
    txt('← → 이동 · Space / 💼 공격',180,275,13,'#ccc');txt('방광 게이지 · 3 WAVE · 보스 🦆',180,297,13,'#ccc');
    txt('클리어 '+clears+'회',180,330,12,'#889');
    if(t%60<40)txt('Space 시작',180,400,18,'#7CFC00');
    g.restore();return;
  }
  emo('🚽',320,390,40);
  emo('🥔',px,py,36);
  if(atk)emo('💼',px+dir*34,py-8,28);
  for(const en of enemies)if(en.alive)emo(en.e,en.x,en.y,en.boss?48:32);
  g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,0,W,40);
  txt('WAVE '+(wave+1)+'/3',180,12,13,'#fff','#000');
  let h='';for(let i=0;i<5;i++)h+=i<hp?'❤️':'🖤';emo(h,60,12,12);
  g.fillStyle='#000';g.fillRect(20,24,320,8);g.fillStyle='#fa0';g.fillRect(20,24,320*pee/100,8);txt('방광',180,22,8,'#fff');
  if(comboT>0)txt(combo+' COMBO!',280,50,14,'#ff0','#000');
  if(msgT>0)txt(msg,180,70,18,'#fff','#000');
  if(st==='dead'){g.fillStyle='rgba(80,0,0,.85)';g.fillRect(0,0,W,H);txt(msg||'실패',180,220,28,'#fff','#000');txt('Space 재시도',180,280,16,'#ccc')}
  if(st==='win'){g.fillStyle='rgba(0,40,0,.88)';g.fillRect(0,0,W,H);txt('화장실 도착!',180,200,30,'#7CFC00','#000');txt('(휴지 없음)',180,240,16,'#fff');if(endT>100&&t%60<40)txt('Space 처음',180,300,14,'#aaa')}
  g.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=1;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=1;
  if(e.code==='Space'||e.code==='KeyJ'){e.preventDefault();if(st==='title'||st==='dead')start();else if(st==='win'){st='title';t=0}else keys.aP=1}
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=0;
  if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=0;
});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='title')start();if(k==='A')keys.aP=1;else if(k==='L'||k==='R')keys[k]=1});
  b.addEventListener('pointerup',()=>{if(k==='L'||k==='R')keys[k]=0});
});
loop();
</script>
</body>
</html>
